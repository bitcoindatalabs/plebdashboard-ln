<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlebRank — Lightning Node Rankings | Plebdashboard</title>
    <meta name="description" content="PlebRank ranks the public Lightning nodes in the latest gossip by a combined score of capacity, channels, betweenness, weighted degree, eigenvector and PageRank.">

    <!-- Bitcoin Data Labs styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css" onerror="this.onerror=null;this.href='https://sorukumar.github.io/Bitcoin-Data-Labs/styles/styles.css'">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/node-rank.css?v=3.4">
    <link rel="stylesheet" href="styles/components.css">

</head>

<body class="has-fixed-header">
    <!-- Bitcoin Data Labs Header -->
    <div id="header"></div>

    <div class="main-content">
        <!-- Page Header -->
        <div class="page-header-compact">
            <div class="page-header-main">
                <div class="page-title-group">
                    <h1>PlebRank: Lightning node rankings</h1>
                    <p id="summaryHeaderTitle">Public nodes in the latest gossip, ranked by a combined score of capacity, channels, betweenness, weighted degree, eigenvector and PageRank.</p>
                </div>
            </div>
        </div>

        <!-- Table Controls & Quick Filter Strip -->
        <div class="table-controls-panel">
            <div class="quick-filter-strip">
                <span class="quick-filter-label"><i class="fas fa-layer-group"></i> Show:</span>
                <div class="quick-filter-chips" id="quickFilterChips">
                    <button type="button" class="filter-chip active" data-filter="all">All Nodes</button>
                    <button type="button" class="filter-chip chip-gold" data-filter="top100">
                        <i class="fas fa-crown"></i> Top 100
                    </button>
                    <button type="button" class="filter-chip chip-green" data-filter="lsp">
                        <i class="fas fa-bolt"></i> LSPs
                    </button>
                    <button type="button" class="filter-chip chip-amber" data-filter="gateway">
                        <i class="fas fa-building-columns"></i> Gateways & Exchanges
                    </button>
                    <button type="button" class="filter-chip chip-pleb" data-filter="pleb">
                        <i class="fas fa-user-astronaut"></i> Pleb Nodes
                    </button>
                </div>
            </div>

            <div class="search-and-meta-row">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search by node alias, pubkey, operator entity, or role..."
                        class="search-input">
                    <i class="fas fa-search search-icon"></i>
                    <button type="button" class="search-clear-btn" id="searchClearBtn" aria-label="Clear search">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="table-status-pill" id="tableStatusPill">
                    <span id="filteredCountBadge">Loading...</span>
                </div>
            </div>
        </div>

        <!-- Leaderboard Table Container -->
        <div class="table-container">
            <div id="loading" class="loading-state">
                <div class="loading-content">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading rankings...</p>
                </div>
            </div>
            <table id="dataTable" class="data-table leaderboard-table" style="display: none;">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-container">
            <div class="pagination-info">
                <span id="paginationInfo">Loading...</span>
            </div>
            <div class="pagination-controls">
                <button id="prevBtn" class="pagination-btn" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span id="pageNumbers" class="page-numbers"></span>
                <button id="nextBtn" class="pagination-btn" disabled>
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Bitcoin Data Labs Footer -->
    <div id="footer"></div>

    <!-- Bitcoin Data Labs App Components -->
    <script src="https://bitcoindatalabs.org/components/app-components.js" onerror="this.onerror=null;this.src='https://sorukumar.github.io/Bitcoin-Data-Labs/components/app-components.js'"></script>
    <!-- App Configuration -->
    <script src="scripts/app-config.js?v=3.7"></script>
    
    <!-- Table functionality as ES module -->
    <script type="module" src="scripts/node-rank.js?v=3.2"></script>
</body>

</html>
