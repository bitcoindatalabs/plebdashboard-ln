<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Reports — Weekly &amp; Monthly | Plebdashboard</title>
    <meta name="description" content="Weekly and monthly reports on public Lightning Network channels: opens, closes, net capacity, close types, movers and node of the week, from on-chain data. Full archive.">

    <!-- Bitcoin Data Labs styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css" onerror="this.onerror=null;this.href='https://sorukumar.github.io/Bitcoin-Data-Labs/styles/styles.css'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/ln-reports.css?v=2">
    <script src="scripts/vendor/echarts-5.5.0.min.js"></script>
</head>

<!--
    Lightning Reports: LN Weekly + LN Monthly, latest and archive.
    Data: data/reports/manifest.json + data/reports/{weekly,monthly}/<id>.json, written by
    python/automation/shared/lightning/report_snapshots.py when a report is published. This page only renders them.
    Permalinks: reports.html?weekly=<week-end YYYY-MM-DD> | reports.html?monthly=<YYYY-MM>.
    body[data-loaded] is "true" once the requested report has rendered (data-report-id names it), "error" otherwise.
    There is no fallback data: if a file fails to load, the page says so.
-->
<body class="has-fixed-header" data-loaded="false">
    <div id="header"></div>

    <div class="main-content">
        <div class="page-header-compact">
            <div class="page-header-main">
                <div class="page-title-group">
                    <h1>Lightning Reports</h1>
                    <p>Weekly and monthly reports on public Lightning channels. Opens are dated by funding block and closes by on-chain close transaction (UTC).</p>
                </div>
                <div class="rpt-tabs" role="tablist" aria-label="Report type">
                    <button type="button" class="rpt-tab" data-type="weekly" role="tab" aria-selected="false">
                        <i class="fas fa-calendar-week"></i> Weekly <span class="rpt-tab-count" data-count="weekly"></span>
                    </button>
                    <button type="button" class="rpt-tab" data-type="monthly" role="tab" aria-selected="false">
                        <i class="fas fa-calendar"></i> Monthly <span class="rpt-tab-count" data-count="monthly"></span>
                    </button>
                </div>
            </div>
        </div>

        <div class="rpt-layout">
            <main class="rpt-report" id="report" aria-live="polite">
                <div class="rpt-loading"><i class="fas fa-spinner fa-spin"></i> Loading report…</div>
            </main>
            <aside class="rpt-archive" aria-label="Report archive">
                <div class="home-card">
                    <div class="card-section-header">
                        <div class="section-title-wrap">
                            <span class="card-eyebrow"><i class="fas fa-box-archive"></i> Archive</span>
                            <h2 id="archiveTitle">Reports</h2>
                        </div>
                    </div>
                    <ol class="rpt-archive-list" id="archiveList"></ol>
                </div>
            </aside>
        </div>
    </div>

    <div id="footer"></div>

    <script src="https://bitcoindatalabs.org/components/app-components.js" onerror="this.onerror=null;this.src='https://sorukumar.github.io/Bitcoin-Data-Labs/components/app-components.js'"></script>
    <script src="scripts/app-config.js?v=3.7"></script>
    <script type="module" src="scripts/ln-reports.js?v=2"></script>
</body>

</html>
